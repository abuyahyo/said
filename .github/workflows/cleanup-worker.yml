name: Delete the leftover tiny-tooth-0ab0 Worker

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-worker.yml"]

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete worker
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          case "$TOKEN" in
            *Bearer*) TOKEN="$(printf '%s' "$TOKEN" | grep -oE 'Bearer[A-Za-z0-9_-]+' | head -1 | sed 's/^Bearer//')";;
          esac
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx --yes wrangler@4 delete --name tiny-tooth-0ab0 --force
