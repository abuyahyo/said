name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          # Telefondan nusxalanganda qiymatga bo'sh joy yoki yangi qator kirib qolishi mumkin — tozalaymiz
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          # Agar token o'rniga "Test this token" curl buyrug'i nusxalangan bo'lsa, undan tokenning o'zini ajratib olamiz
          case "$TOKEN" in
            *Bearer*) TOKEN="$(printf '%s' "$TOKEN" | grep -oE 'Bearer[A-Za-z0-9_-]+' | head -1 | sed 's/^Bearer//')";;
          esac
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN yoki CLOUDFLARE_ACCOUNT_ID secret kiritilmagan, deploy o'tkazib yuborildi."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$TOKEN"
            echo "Token uzunligi: ${#TOKEN} belgi. Account ID uzunligi: ${#ACCOUNT} belgi."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
            echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.check.outputs.token }}
          accountId: ${{ steps.check.outputs.account }}
          workingDirectory: worker
          command: deploy
      - name: Register Telegram webhook
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            out="$(curl -s --max-time 20 https://said-form.saidacademy2025.workers.dev/tg-setup || true)"
            echo "$out"
            case "$out" in *'"ok":true'*) exit 0;; esac
            sleep 10
          done
          echo "::warning::Webhook ro'yxatdan o'tmadi (BOT_TOKEN Cloudflare'da kiritilganini tekshiring)."
